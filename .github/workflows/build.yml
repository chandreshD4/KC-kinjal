name: Build APK FROM SCRATCH

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      # यहाँ हम ऐप का नाम बदलकर 'KC-ARADHANA' कर रहे हैं
      - name: Create Fresh Android Native Files
        run: |
          flutter create . --org com.example --project-name kc_kinjal --platforms android

      - name: Inject Internet and Storage Permissions & App Name
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          # इंटरनेट और स्टोरेज अनुमतियाँ जोड़ना
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />' $MANIFEST_PATH
          # Legacy Storage और नया नाम सेट करना
          sed -i 's/android:label="kc_kinjal"/android:label="KC-ARADHANA"/' $MANIFEST_PATH
          sed -i 's/<application/<application android:requestLegacyExternalStorage="true"/' $MANIFEST_PATH

      - name: Configure Main App Icon
        run: |
          cp assets/icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp assets/icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Fetch Clean Dependencies
        run: flutter pub get

      - name: Build New Release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
