name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Force Create Android Folder & Configure SDKs
        run: |
          # 1. प्रोजेक्ट का नाम ठीक रखते हुए एंड्रॉइड फ़ोल्डर बनाएं
          flutter create --project-name=kc_kinjal --platforms=android .
          
          # 2. कोटलिन वर्जन को 1.9.20 पर सेट करें
          if [ -f "android/build.gradle" ]; then
            sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.20'/g" android/build.gradle
          fi
          
          # 3. minSdkVersion को 19 से बढ़ाकर 21 करें ताकि माइक फीचर काम कर सके
          if [ -f "android/app/build.gradle" ]; then
            sed -i "s/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g" android/app/build.gradle
            sed -i "s/minSdkVersion 19/minSdkVersion 21/g" android/app/build.gradle
          fi

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
